{{- if .Values.collectors }}
{{- range .Values.collectors }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netobserv.workloadName" (dict "root" $ "name" .name) }}
  labels:
    {{- include "netobserv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name | quote }}
  annotations: {{ $.Values.service.annotations | toYaml | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: {{ .loadBalancerIP | quote }}
  {{- with $.Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- include "netobserv.udpServicePorts" $ | nindent 4 }}
  selector:
    {{- include "netobserv.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name | quote }}
{{- end }}
{{- end }}
